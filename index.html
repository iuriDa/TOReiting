<!--

  Организация: Спортивно-цирковая студия «Точка Отрыва»
  Telegram: @iuriletics | Бот: @Tochka_Otriva_bot
  Все права защищены.

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Точка Отрыва · Результаты</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --line:#2a3242;
    --ink:#e6edf3; --mut:#8b97a7; --accent:#ff6b35; --accent2:#ffb020;
    --good:#3fb950; --bad:#f85149; --gold:#ffd23f;
    --r:16px; --r2:12px; --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;overscroll-behavior:none;}
  body{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;}
  header{padding:14px 16px 12px;background:linear-gradient(135deg,#161b22,#1c2230);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;}
  .brand{display:flex;align-items:center;gap:10px;}
  .logo{width:36px;height:36px;border-radius:10px;flex:none;background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;font-weight:800;color:#1a1206;font-size:18px;}
  .brand h1{font-size:16px;margin:0;letter-spacing:.2px;}
  .brand .sub{font-size:11px;color:var(--mut);margin-top:1px;}
  .net{margin-left:auto;font-size:11px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);display:flex;align-items:center;gap:5px;}
  .net .dot{width:7px;height:7px;border-radius:50%;background:var(--bad);}
  .net.on .dot{background:var(--good);}
  .crumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:12px;}
  .crumb{background:var(--panel2);border:1px solid var(--line);padding:4px 10px;border-radius:20px;color:var(--mut);}
  .crumb b{color:var(--ink);font-weight:600;}
  main{flex:1;padding:14px 14px calc(96px + var(--safe-b));}
  .sec-title{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);margin:18px 4px 8px;
    display:flex;align-items:center;justify-content:space-between;}
  .sec-title:first-child{margin-top:4px;}
  .sec-title .add{color:var(--accent2);font-weight:700;cursor:pointer;text-transform:none;letter-spacing:0;font-size:13px;}
  .list{display:flex;flex-direction:column;gap:8px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
    display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .08s,border-color .15s;}
  .card:active{transform:scale(.985);border-color:var(--accent);}
  .card .ic{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;background:var(--panel2);font-size:20px;}
  .card .body{flex:1;min-width:0;}
  .card .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card .d{font-size:12px;color:var(--mut);margin-top:2px;}
  .card .chev{color:var(--mut);font-size:18px;}
  .pill{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .pill.act{background:rgba(63,185,80,.15);color:var(--good);}
  .pill.ina{background:rgba(139,151,167,.15);color:var(--mut);}
  .pill.done{background:rgba(255,210,63,.15);color:var(--gold);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .agecard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 12px;
    text-align:center;cursor:pointer;transition:transform .08s,border-color .15s;}
  .agecard:active{transform:scale(.97);border-color:var(--accent);}
  .agecard .n{font-size:20px;font-weight:800;}
  .agecard .l{font-size:11px;color:var(--mut);margin-top:3px;}
  .agecard .c{font-size:11px;color:var(--accent2);margin-top:6px;}
  .athlete-head{background:linear-gradient(135deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:var(--r);padding:16px;margin-bottom:14px;}
  .athlete-head .nm{font-size:19px;font-weight:700;}
  .athlete-head .mt{font-size:12px;color:var(--mut);margin-top:4px;}
  .disc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;margin-bottom:8px;}
  .disc .top{display:flex;align-items:center;gap:8px;}
  .disc .nm{font-weight:600;font-size:14px;flex:1;}
  .disc .dir{font-size:10px;color:var(--mut);border:1px solid var(--line);padding:2px 7px;border-radius:12px;}
  .disc .row{display:flex;gap:8px;margin-top:10px;align-items:center;}
  .disc input.res{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--ink);font-size:18px;font-weight:700;
    padding:11px 12px;border-radius:10px;width:100%;text-align:center;-moz-appearance:textfield;}
  .disc input.res::-webkit-outer-spin-button,.disc input.res::-webkit-inner-spin-button{-webkit-appearance:none;}
  .disc input.res:focus{outline:none;border-color:var(--accent);}
  .disc .unit{font-size:13px;color:var(--mut);min-width:54px;}
  .disc.saved{border-color:rgba(63,185,80,.4);}
  .disc.saved input.res{color:var(--good);}
  .rank{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r2);padding:11px 14px;margin-bottom:7px;}
  .rank .pos{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--panel2);}
  .rank.p1 .pos{background:linear-gradient(135deg,#ffd23f,#e0a020);color:#3a2a00;}
  .rank.p2 .pos{background:linear-gradient(135deg,#d8e0ea,#a8b2c0);color:#2a2f38;}
  .rank.p3 .pos{background:linear-gradient(135deg,#e8a060,#c47028);color:#3a1f00;}
  .rank .nm{flex:1;font-weight:600;font-size:14px;}
  .rank .res{font-weight:800;font-size:16px;color:var(--accent2);}
  .rank .none{color:var(--mut);font-weight:400;font-size:13px;}
  .btn{width:100%;border:none;border-radius:13px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;
    color:#1a1206;background:linear-gradient(135deg,var(--accent),var(--accent2));transition:transform .08s;}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);}
  .btn.danger{background:var(--panel);color:var(--bad);border:1px solid rgba(248,81,73,.4);}
  .seg{display:flex;gap:6px;margin-bottom:12px;}
  .seg button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--mut);padding:9px;border-radius:10px;
    font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .seg button.on{background:var(--accent);color:#1a1206;border-color:var(--accent);}
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:560px;margin:0 auto;
    background:linear-gradient(180deg,rgba(13,17,23,.4),var(--bg) 40%);
    padding:10px 14px calc(12px + var(--safe-b));display:flex;gap:8px;}
  .dock .btn{flex:1;}
  .back{background:none;border:none;color:var(--accent2);font-size:14px;font-weight:600;cursor:pointer;
    padding:4px 0;display:flex;align-items:center;gap:5px;margin-bottom:6px;}
  .empty{text-align:center;color:var(--mut);padding:36px 20px;font-size:14px;line-height:1.6;}
  .toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:#000;color:#fff;
    padding:10px 18px;border-radius:24px;font-size:13px;z-index:90;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:.95;}
  .check{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r2);padding:13px 14px;margin-bottom:7px;transition:border-color .15s;}
  .check.on{border-color:var(--accent);background:var(--panel2);}
  .check .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;
    font-size:15px;color:#1a1206;cursor:pointer;}
  .check.on .box{background:var(--accent);border-color:var(--accent);}
  .check .body{flex:1;min-width:0;cursor:pointer;}
  .check .t{font-weight:600;font-size:14px;}
  .check .d{font-size:12px;color:var(--mut);margin-top:1px;}
  .check .del{color:var(--mut);font-size:18px;padding:4px 8px;cursor:pointer;}
  .modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:none;align-items:flex-end;}
  .modal.show{display:flex;}
  .sheet{background:var(--panel);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;
    padding:20px 18px calc(20px + var(--safe-b));border-top:1px solid var(--line);max-height:90vh;overflow:auto;}
  .sheet h3{margin:0 0 14px;font-size:17px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;}
  .field input,.field select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);font-size:15px;
    padding:12px;border-radius:10px;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);}
  .row2{display:flex;gap:8px;}
  .row2 .field{flex:1;}
  .seg.small button{padding:11px 8px;font-size:13px;}
  .hint{font-size:12px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);
    border-radius:var(--r2);padding:11px 13px;line-height:1.5;margin-bottom:10px;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">ТО</div>
    <div><h1>Результаты</h1><div class="sub">Точка Отрыва · соревнования</div></div>
    <div class="net" id="net"><span class="dot"></span><span id="netTxt">офлайн</span></div>
  </div>
  <div class="crumbs" id="crumbs"></div>
</header>

<main id="app"></main>
<div class="dock" id="dock"></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
/* ============================================================
   МОДЕЛЬ ДАННЫХ (v3)
   Каждое мероприятие хранит СВОИ группы и дисциплины (копии, не ссылки),
   поэтому можно делать уникальные настройки под конкретный турнир.

   event = {
     id, name, date, status:'active'|'archive',
     groups: [ {id, min, max, label} ... ],          // свои возрастные группы
     discs:  [ {id, name, unit, dir:'max'|'min'} ],   // свои дисциплины
     roster: [ athleteId ... ]                        // кто участвует (из общего списка)
   }

   Шаблоны для переиспользования (чтобы не вводить каждый раз заново):
     GROUP_TEMPLATES, DISC_TEMPLATES — пополняются, когда создаёшь новое.
   ============================================================ */
let EVENTS=[];
let ATHLETES=[];          // общий список спортсменов (из Google Sheets)
let RESULTS={};           // "ev|athleteId|discId" -> число
let DIRTY={};
let GROUP_TEMPLATES=[];   // [{min,max,label}] — недавно использованные группы
let DISC_TEMPLATES=[];    // [{name,unit,dir}] — каталог дисциплин

/* стартовые подсказки (можно удалить/изменить — они лишь шаблоны для быстрого выбора) */
const DEFAULT_GROUPS=[{min:3,max:4},{min:5,max:6},{min:7,max:8},{min:9,max:10},{min:11,max:12}];
const DEFAULT_DISCS=[
  {name:'Подтягивания 30 сек',unit:'раз',dir:'max'},
  {name:'Прыжок в длину',unit:'см',dir:'max'},
  {name:'Челночный бег 3×10',unit:'сек',dir:'min'},
  {name:'Пресс 30 сек',unit:'раз',dir:'max'},
  {name:'Шпагат (до пола)',unit:'см',dir:'min'},
  {name:'Speed 30 сек',unit:'прыжки',dir:'max'},
];

function ageOf(dob){const b=new Date(dob),n=new Date();let a=n.getFullYear()-b.getFullYear();
  const m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))a--;return a;}
/* группа спортсмена ВНУТРИ конкретного мероприятия (по его группам) */
function groupOfIn(ev,dob){const a=ageOf(dob);return ev.groups.find(g=>a>=g.min&&a<=g.max)||null;}
function rk(ev,a,d){return `${ev}|${a}|${d}`;}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function groupLabel(g){return g.label||(g.min===g.max?`${g.min} лет`:`${g.min}–${g.max} лет`);}

/* ── Хранилище IndexedDB ── */
const DB_NAME='tochka_results3',STORE='kv';let _db=null;
function db(){return new Promise((res,rej)=>{if(_db)return res(_db);const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>{_db=r.result;res(_db);};r.onerror=()=>rej(r.error);});}
function kvGet(k){return db().then(d=>new Promise(r=>{const t=d.transaction(STORE).objectStore(STORE).get(k);t.onsuccess=()=>r(t.result);t.onerror=()=>r(undefined);}));}
function kvSet(k,v){return db().then(d=>new Promise(r=>{const t=d.transaction(STORE,'readwrite').objectStore(STORE).put(v,k);t.onsuccess=()=>r(true);t.onerror=()=>r(false);}));}
async function loadAll(){
  EVENTS=(await kvGet('events'))||[];RESULTS=(await kvGet('results'))||{};DIRTY=(await kvGet('dirty'))||{};
  ATHLETES=(await kvGet('athletes'))||[];
  GROUP_TEMPLATES=(await kvGet('gtpl'))||DEFAULT_GROUPS.slice();
  DISC_TEMPLATES=(await kvGet('dtpl'))||DEFAULT_DISCS.slice();
}
async function saveEvents(){await kvSet('events',EVENTS);}
async function saveResults(){await kvSet('results',RESULTS);await kvSet('dirty',DIRTY);}
async function saveTpl(){await kvSet('gtpl',GROUP_TEMPLATES);await kvSet('dtpl',DISC_TEMPLATES);}

/* ── Навигация ── */
const S={ev:null,group:null,athlete:null,view:'events'};
const app=document.getElementById('app'),dock=document.getElementById('dock'),crumbsEl=document.getElementById('crumbs');
const modal=document.getElementById('modal'),sheet=document.getElementById('sheet');
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1900);}
function curEvent(){return EVENTS.find(e=>e.id===S.ev);}
function rosterAthletes(ev){return ATHLETES.filter(a=>ev.roster.includes(a.id));}

function crumbs(){
  const p=[];const ev=curEvent();
  if(ev)p.push(`<span class="crumb">📋 <b>${ev.name}</b></span>`);
  if(S.group&&ev){const g=ev.groups.find(g=>g.id===S.group);if(g)p.push(`<span class="crumb">👥 <b>${groupLabel(g)}</b></span>`);}
  if(S.athlete){const a=ATHLETES.find(a=>a.id===S.athlete);if(a)p.push(`<span class="crumb">🏃 <b>${a.fio}</b></span>`);}
  crumbsEl.innerHTML=p.join('');
}
function render(){crumbs();dock.innerHTML='';
  ({events:viewEvents,setup:viewSetup,groups:viewGroups,athletes:viewAthletes,athlete:viewAthlete,ranking:viewRanking}[S.view]||viewEvents)();}

/* ════════════ Экран: список мероприятий ════════════ */
function viewEvents(){
  const active=EVENTS.filter(e=>e.status==='active');
  const arch=EVENTS.filter(e=>e.status!=='active');
  let h='';
  if(!EVENTS.length){
    h=`<div class="empty">У тебя пока нет мероприятий.<br>Нажми «+ Новое мероприятие», чтобы создать первое.<br><br>Участников можно добавить позже.</div>`;
  }else{
    h=`<div class="sec-title">Активные</div><div class="list">`;
    h+=active.map(eventCard).join('')||`<div class="empty">Нет активных</div>`;
    h+=`</div>`;
    if(arch.length)h+=`<div class="sec-title">Архив</div><div class="list">${arch.map(eventCard).join('')}</div>`;
  }
  app.innerHTML=h;
  app.querySelectorAll('[data-ev]').forEach(el=>el.onclick=()=>openEvent(el.dataset.ev));
  dock.innerHTML=`<button class="btn ghost" id="sync">⟳ Синхр.</button><button class="btn" id="new">+ Новое мероприятие</button>`;
  document.getElementById('new').onclick=newEventDialog;
  document.getElementById('sync').onclick=syncUp;
}
function eventCard(e){
  const pill=e.status==='active'?'<span class="pill act">активно</span>':'<span class="pill ina">архив</span>';
  return `<div class="card" data-ev="${e.id}"><div class="ic">🏆</div>
    <div class="body"><div class="t">${e.name}</div>
      <div class="d">${fmtDate(e.date)} · ${e.roster.length} участ. · ${e.discs.length} дисц.</div></div>
    ${pill}<span class="chev">›</span></div>`;
}
/* теперь всегда ведём в настройку — оттуда можно и судить, и редактировать */
function openEvent(id){S.ev=id;S.group=null;S.athlete=null;S.view='setup';render();}

/* создание мероприятия — БЕЗ обязательных участников */
function newEventDialog(){
  sheet.innerHTML=`<h3>Новое мероприятие</h3>
    <div class="field"><label>Название</label><input id="m_name" placeholder="Например: Весенний кубок"></div>
    <div class="field"><label>Дата проведения</label><input id="m_date" type="date" value="${todayISO()}"></div>
    <div class="hint">Группы, дисциплины и участников добавишь на следующем экране — в любом порядке и когда удобно.</div>
    <div class="row2"><button class="btn ghost" id="m_cancel">Отмена</button><button class="btn" id="m_ok">Создать</button></div>`;
  showModal();
  document.getElementById('m_cancel').onclick=hideModal;
  document.getElementById('m_ok').onclick=()=>{
    const name=document.getElementById('m_name').value.trim();
    if(!name){toast('Введи название');return;}
    const ev={id:uid('ev'),name,date:document.getElementById('m_date').value,status:'active',groups:[],discs:[],roster:[]};
    EVENTS.unshift(ev);saveEvents();hideModal();S.ev=ev.id;S.view='setup';render();toast('Создано');
  };
}

/* ════════════ Экран: настройка/редактирование мероприятия ════════════ */
function viewSetup(){
  const ev=curEvent();
  const ready=ev.groups.length&&ev.discs.length&&ev.roster.length;
  app.innerHTML=`<button class="back" onclick="goBack('events')">‹ Мероприятия</button>
    <div class="athlete-head"><div class="nm">${ev.name}</div><div class="mt">${fmtDate(ev.date)} · ${ev.status==='active'?'активно':'архив'}</div></div>
    <div class="hint">Настраивай в любом порядке. Всё можно менять и после соревнования.</div>
    <div class="list">
      ${setupRow('👥','Возрастные группы',ev.groups.length?ev.groups.map(groupLabel).join(', '):'не заданы','editGroups')}
      ${setupRow('🎯','Дисциплины',ev.discs.length?ev.discs.map(d=>d.name).join(', '):'не заданы','editDiscs')}
      ${setupRow('🏃','Участники',ev.roster.length?`${ev.roster.length} спортсменов`:'не выбраны','editRoster')}
    </div>
    <div class="sec-title">Управление</div>
    <div class="list">
      ${setupRow('✏️','Переименовать / дата','','renameEvent')}
      ${setupRow(ev.status==='active'?'📦':'✅',ev.status==='active'?'В архив':'Вернуть в активные','','toggleArchive')}
      ${setupRow('🗑','Удалить мероприятие','без возможности отмены','deleteEvent')}
    </div>`;
  app.querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>window[el.dataset.act]());
  dock.innerHTML=`<button class="btn ghost" onclick="goBack('events')">Назад</button>
    <button class="btn" id="go" ${ready?'':'style="opacity:.5"'}>Судить →</button>`;
  document.getElementById('go').onclick=()=>{
    if(!ev.groups.length){toast('Добавь хотя бы одну группу');return;}
    if(!ev.discs.length){toast('Добавь хотя бы одну дисциплину');return;}
    if(!ev.roster.length){toast('Отметь участников');return;}
    S.view='groups';render();
  };
}
function setupRow(ic,t,d,act){
  return `<div class="card" data-act="${act}"><div class="ic">${ic}</div>
    <div class="body"><div class="t">${t}</div>${d?`<div class="d">${d}</div>`:''}</div><span class="chev">›</span></div>`;
}

/* ── Редактор возрастных групп мероприятия ── */
window.editGroups=function(){
  const ev=curEvent();
  const render=()=>{
    const tplUnused=GROUP_TEMPLATES.filter(t=>!ev.groups.some(g=>g.min===t.min&&g.max===t.max));
    sheet.innerHTML=`<h3>Возрастные группы</h3>
      <div class="hint">Группы только этого мероприятия. Можно создать свои (например, 4–5 лет) или взять из недавних.</div>
      <div class="sec-title">В мероприятии</div>
      <div id="cur">${ev.groups.length?ev.groups.map(g=>
        `<div class="check on"><div class="body"><div class="t">${groupLabel(g)}</div></div>
          <div class="del" data-del="${g.id}">✕</div></div>`).join(''):'<div class="empty" style="padding:14px">Пока нет групп</div>'}</div>
      <div class="row2" style="margin-top:6px;">
        <div class="field"><label>От (лет)</label><input id="g_min" type="number" inputmode="numeric" placeholder="4"></div>
        <div class="field"><label>До (лет)</label><input id="g_max" type="number" inputmode="numeric" placeholder="5"></div>
      </div>
      <button class="btn" id="g_add">+ Добавить группу</button>
      ${tplUnused.length?`<div class="sec-title">Из недавних — нажми, чтобы добавить</div>
        <div class="seg" style="flex-wrap:wrap;">${tplUnused.map((t,i)=>
          `<button data-tpl="${i}" style="flex:none;">${t.min}–${t.max}</button>`).join('')}</div>`:''}
      <button class="btn ghost" id="g_done" style="margin-top:10px;">Готово</button>`;
    sheet.querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{
      ev.groups=ev.groups.filter(g=>g.id!==el.dataset.del);saveEvents();render();});
    sheet.querySelectorAll('[data-tpl]').forEach(el=>el.onclick=()=>{
      const t=tplUnused[+el.dataset.tpl];addGroup(t.min,t.max);});
    document.getElementById('g_add').onclick=()=>{
      const mn=parseInt(document.getElementById('g_min').value,10),mx=parseInt(document.getElementById('g_max').value,10);
      if(isNaN(mn)||isNaN(mx)){toast('Введи возраст от и до');return;}
      if(mn>mx){toast('«От» больше «До»');return;}addGroup(mn,mx);};
    document.getElementById('g_done').onclick=()=>{hideModal();viewSetup();};
  };
  const addGroup=(mn,mx)=>{
    if(ev.groups.some(g=>g.min===mn&&g.max===mx)){toast('Такая группа уже есть');return;}
    ev.groups.push({id:uid('g'),min:mn,max:mx,label:`${mn}–${mx} лет`});
    ev.groups.sort((a,b)=>a.min-b.min);
    if(!GROUP_TEMPLATES.some(t=>t.min===mn&&t.max===mx)){GROUP_TEMPLATES.push({min:mn,max:mx});saveTpl();}
    saveEvents();render();
  };
  showModal();render();
};

/* ── Редактор дисциплин мероприятия ── */
window.editDiscs=function(){
  const ev=curEvent();
  const render=()=>{
    const tplUnused=DISC_TEMPLATES.filter(t=>!ev.discs.some(d=>d.name===t.name));
    sheet.innerHTML=`<h3>Дисциплины</h3>
      <div class="hint">Дисциплины только этого мероприятия. Создай новую или возьми из каталога.</div>
      <div class="sec-title">В мероприятии</div>
      <div id="cur">${ev.discs.length?ev.discs.map(d=>
        `<div class="check on"><div class="body"><div class="t">${d.name}</div>
          <div class="d">${d.dir==='max'?'↑ больше лучше':'↓ меньше лучше'} · ${d.unit}</div></div>
          <div class="del" data-del="${d.id}">✕</div></div>`).join(''):'<div class="empty" style="padding:14px">Пока нет дисциплин</div>'}</div>
      <div class="field"><label>Название новой</label><input id="d_name" placeholder="Например: Отжимания 30 сек"></div>
      <div class="row2">
        <div class="field"><label>Единица</label><input id="d_unit" placeholder="раз / см / сек"></div>
        <div class="field"><label>Лучший результат —</label>
          <select id="d_dir"><option value="max">больше (↑)</option><option value="min">меньше (↓)</option></select></div>
      </div>
      <button class="btn" id="d_add">+ Добавить дисциплину</button>
      ${tplUnused.length?`<div class="sec-title">Из каталога — нажми, чтобы добавить</div>
        <div id="tpl" class="list">${tplUnused.map((t,i)=>
          `<div class="check"><div class="box" data-tpl="${i}">+</div>
            <div class="body" data-tpl="${i}"><div class="t">${t.name}</div>
            <div class="d">${t.dir==='max'?'↑ больше':'↓ меньше'} · ${t.unit}</div></div></div>`).join('')}</div>`:''}
      <button class="btn ghost" id="d_done" style="margin-top:10px;">Готово</button>`;
    sheet.querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{
      ev.discs=ev.discs.filter(d=>d.id!==el.dataset.del);saveEvents();render();});
    sheet.querySelectorAll('[data-tpl]').forEach(el=>el.onclick=()=>{const t=tplUnused[+el.dataset.tpl];addDisc(t.name,t.unit,t.dir);});
    document.getElementById('d_add').onclick=()=>{
      const name=document.getElementById('d_name').value.trim();
      const unit=document.getElementById('d_unit').value.trim()||'';
      const dir=document.getElementById('d_dir').value;
      if(!name){toast('Введи название');return;}addDisc(name,unit,dir);};
    document.getElementById('d_done').onclick=()=>{hideModal();viewSetup();};
  };
  const addDisc=(name,unit,dir)=>{
    if(ev.discs.some(d=>d.name===name)){toast('Такая дисциплина уже есть');return;}
    ev.discs.push({id:uid('d'),name,unit,dir});
    if(!DISC_TEMPLATES.some(t=>t.name===name)){DISC_TEMPLATES.push({name,unit,dir});saveTpl();}
    saveEvents();render();
  };
  showModal();render();
};

/* ── Редактор участников (из общего списка) ── */
window.editRoster=function(){
  const ev=curEvent();
  if(!ATHLETES.length){
    sheet.innerHTML=`<h3>Участники</h3>
      <div class="hint">Общий список спортсменов пуст.<br><br>Занеси спортсменов в <b>Google-таблицу</b> (лист «Участники»): ФИО, дата рождения, пол. Потом нажми «⟳ Синхр.» при интернете — они появятся здесь.</div>
      <button class="btn" id="ok">Понятно</button>`;
    showModal();document.getElementById('ok').onclick=()=>{hideModal();viewSetup();};return;
  }
  const sorted=[...ATHLETES].sort((a,b)=>a.fio.localeCompare(b.fio,'ru'));
  sheet.innerHTML=`<h3>Кто участвует</h3>
    <div class="hint">Отметь спортсменов из общего списка. Возрастная группа подберётся по группам этого мероприятия.</div>
    <div id="rl" style="max-height:55vh;overflow:auto;">${sorted.map(a=>{
      const g=groupOfIn(ev,a.dob);const on=ev.roster.includes(a.id);
      return `<div class="check ${on?'on':''}" data-val="${a.id}">
        <div class="box">${on?'✓':''}</div>
        <div class="body"><div class="t">${a.fio}</div>
          <div class="d">${a.sex==='м'?'👦':'👧'} ${ageOf(a.dob)} лет · ${g?groupLabel(g):'нет подходящей группы'}</div></div></div>`;}).join('')}</div>
    <button class="btn" id="ok" style="margin-top:8px;">Готово</button>`;
  showModal();
  document.getElementById('rl').querySelectorAll('.check').forEach(el=>{
    el.onclick=()=>{const on=el.classList.toggle('on');el.querySelector('.box').textContent=on?'✓':'';};});
  document.getElementById('ok').onclick=()=>{
    ev.roster=[...document.getElementById('rl').querySelectorAll('.check.on')].map(el=>el.dataset.val);
    saveEvents();hideModal();viewSetup();};
};

/* ── Управление мероприятием ── */
window.renameEvent=function(){const ev=curEvent();
  sheet.innerHTML=`<h3>Изменить мероприятие</h3>
    <div class="field"><label>Название</label><input id="r_name" value="${ev.name.replace(/"/g,'&quot;')}"></div>
    <div class="field"><label>Дата</label><input id="r_date" type="date" value="${ev.date||todayISO()}"></div>
    <div class="row2"><button class="btn ghost" id="c">Отмена</button><button class="btn" id="ok">Сохранить</button></div>`;
  showModal();document.getElementById('c').onclick=()=>{hideModal();viewSetup();};
  document.getElementById('ok').onclick=()=>{const n=document.getElementById('r_name').value.trim();
    if(!n){toast('Название пустое');return;}ev.name=n;ev.date=document.getElementById('r_date').value;
    saveEvents();hideModal();viewSetup();toast('Сохранено');};};
window.toggleArchive=function(){const ev=curEvent();ev.status=ev.status==='active'?'archive':'active';saveEvents();viewSetup();
  toast(ev.status==='active'?'В активных':'В архиве');};
window.deleteEvent=function(){const ev=curEvent();
  sheet.innerHTML=`<h3>Удалить мероприятие?</h3>
    <div class="hint">«${ev.name}» и все его результаты будут удалены без возможности отмены.</div>
    <div class="row2"><button class="btn ghost" id="c">Отмена</button><button class="btn danger" id="ok">Удалить</button></div>`;
  showModal();document.getElementById('c').onclick=()=>{hideModal();viewSetup();};
  document.getElementById('ok').onclick=()=>{
    Object.keys(RESULTS).forEach(k=>{if(k.startsWith(ev.id+'|')){delete RESULTS[k];delete DIRTY[k];}});
    EVENTS=EVENTS.filter(e=>e.id!==ev.id);saveEvents();saveResults();hideModal();S.ev=null;S.view='events';render();toast('Удалено');};};

/* ════════════ Экран: группы (для судейства) ════════════ */
function viewGroups(){
  const ev=curEvent();const roster=rosterAthletes(ev);
  app.innerHTML=`<button class="back" onclick="goBack('events')">‹ Мероприятия</button>
    <div class="sec-title">Возрастная группа</div>
    <div class="grid2">${ev.groups.map(g=>{
      const c=roster.filter(a=>{const gg=groupOfIn(ev,a.dob);return gg&&gg.id===g.id;}).length;
      return `<div class="agecard" data-g="${g.id}"><div class="n">${g.min}–${g.max}</div>
        <div class="l">лет</div><div class="c">${c} участ.</div></div>`;}).join('')}</div>`;
  app.querySelectorAll('[data-g]').forEach(el=>el.onclick=()=>{S.group=el.dataset.g;S.view='athletes';render();});
  dock.innerHTML=`<button class="btn ghost" id="edit">⚙ Настройки мероприятия</button>`;
  document.getElementById('edit').onclick=()=>{S.view='setup';render();};
}

/* ════════════ Экран: участники группы ════════════ */
function viewAthletes(){
  const ev=curEvent();const g=ev.groups.find(g=>g.id===S.group);
  const aths=rosterAthletes(ev).filter(a=>{const gg=groupOfIn(ev,a.dob);return gg&&gg.id===S.group;});
  let h=`<button class="back" onclick="goBack('groups')">‹ Группы</button>
    <div class="sec-title">${groupLabel(g)} · нажми для ввода</div><div class="list">`;
  h+=aths.map(a=>{
    const filled=ev.discs.filter(d=>RESULTS[rk(ev.id,a.id,d.id)]!=null).length;
    const done=filled>0?`<span class="pill done">${filled}/${ev.discs.length}</span>`:'';
    return `<div class="card" data-a="${a.id}"><div class="ic">${a.sex==='м'?'👦':'👧'}</div>
      <div class="body"><div class="t">${a.fio}</div><div class="d">${fmtDate(a.dob)} · ${ageOf(a.dob)} лет</div></div>
      ${done}<span class="chev">›</span></div>`;
  }).join('')||`<div class="empty">В этой группе нет участников.<br>Проверь «Участники» в настройках, или возраст не попадает в ${groupLabel(g)}.</div>`;
  h+=`</div>`;app.innerHTML=h;
  app.querySelectorAll('[data-a]').forEach(el=>el.onclick=()=>{S.athlete=el.dataset.a;S.view='athlete';render();});
  dock.innerHTML=`<button class="btn" id="rk">🥇 Показать места</button>`;
  document.getElementById('rk').onclick=()=>{S.view='ranking';render();};
}

/* ════════════ Экран: ввод результатов ════════════ */
function viewAthlete(){
  const ev=curEvent();const a=ATHLETES.find(x=>x.id===S.athlete);const g=groupOfIn(ev,a.dob);
  let h=`<button class="back" onclick="goBack('athletes')">‹ Участники</button>
    <div class="athlete-head"><div class="nm">${a.fio}</div>
      <div class="mt">${a.sex==='м'?'👦':'👧'} ${fmtDate(a.dob)} · ${ageOf(a.dob)} лет · ${g?groupLabel(g):'вне групп'}</div></div>`;
  h+=ev.discs.map(d=>{const v=RESULTS[rk(ev.id,a.id,d.id)];
    return `<div class="disc ${v!=null?'saved':''}"><div class="top"><div class="nm">${d.name}</div>
      <div class="dir">${d.dir==='max'?'↑ больше лучше':'↓ меньше лучше'}</div></div>
      <div class="row"><input class="res" type="number" inputmode="decimal" step="any" placeholder="—"
        value="${v!=null?v:''}" data-input="${d.id}"><span class="unit">${d.unit}</span></div></div>`;}).join('')
    ||`<div class="empty">У мероприятия нет дисциплин.<br>Добавь их в настройках.</div>`;
  app.innerHTML=h;
  app.querySelectorAll('[data-input]').forEach(inp=>{inp.onchange=()=>{
    const key=rk(ev.id,a.id,inp.dataset.input);const raw=inp.value.trim();
    if(raw===''){delete RESULTS[key];delete DIRTY[key];}else{RESULTS[key]=parseFloat(raw.replace(',','.'));DIRTY[key]=1;}
    saveResults();inp.closest('.disc').classList.toggle('saved',raw!=='');toast('Сохранено');};});
  dock.innerHTML=`<button class="btn ghost" onclick="goBack('athletes')">Готово</button>
    <button class="btn" id="rk">🥇 Места</button>`;
  document.getElementById('rk').onclick=()=>{S.view='ranking';render();};
}

/* ════════════ Подсчёт мест ════════════ */
function placesInDiscipline(aths,d,evId){
  const scored=aths.map(a=>({a,v:RESULTS[rk(evId,a.id,d.id)]})).filter(x=>x.v!=null);
  scored.sort((x,y)=>d.dir==='max'?y.v-x.v:x.v-y.v);
  const map=new Map();let place=0,prev=null;
  scored.forEach((x,i)=>{if(prev===null||x.v!==prev){place=i+1;prev=x.v;}map.set(x.a.id,{place,value:x.v});});
  return map;
}
let RANK_SEX='м';
function viewRanking(){
  const ev=curEvent();
  const tabs=[...ev.discs.map(d=>({id:d.id,label:d.name.split(' ')[0]})),{id:'__total__',label:'Общий зачёт'}];
  let cur=tabs[0]?tabs[0].id:'__total__';
  const segSex=`<div class="seg" id="segSex" style="margin-bottom:14px;">
    <button data-s="м" class="${RANK_SEX==='м'?'on':''}">👦 Мальчики</button>
    <button data-s="ж" class="${RANK_SEX==='ж'?'on':''}">👧 Девочки</button></div>`;
  const segDisc=`<div class="seg" id="seg">${tabs.map((t,i)=>
    `<button data-d="${t.id}" class="${i===0?'on':''}">${t.label}</button>`).join('')}</div>`;
  app.innerHTML=`<button class="back" onclick="goBack('athletes')">‹ Участники</button>
    ${segSex}<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">${segDisc}</div><div id="rankBody"></div>`;
  const draw=()=>{
    const aths=rosterAthletes(ev).filter(a=>{const g=groupOfIn(ev,a.dob);return g&&g.id===S.group&&a.sex===RANK_SEX;});
    let b='';
    if(cur==='__total__')b=drawTotal(aths);
    else{const d=ev.discs.find(x=>x.id===cur);const pl=placesInDiscipline(aths,d,ev.id);
      const ranked=[...pl.entries()].map(([id,o])=>({a:aths.find(x=>x.id===id),...o})).sort((x,y)=>x.place-y.place);
      const none=aths.filter(a=>!pl.has(a.id));
      b=`<div class="sec-title">${d.name} · ${d.dir==='max'?'больше лучше ↑':'меньше лучше ↓'}</div>`;
      if(!ranked.length)b+=`<div class="empty">Пока нет результатов</div>`;
      b+=ranked.map(x=>rankRow(x.place,x.a.fio,`${x.value} <span style="font-size:12px;color:var(--mut)">${d.unit}</span>`)).join('');
      if(none.length)b+=`<div class="sec-title">Без результата</div>`+none.map(a=>`<div class="rank"><div class="pos">–</div><div class="nm none">${a.fio}</div></div>`).join('');}
    document.getElementById('rankBody').innerHTML=b;
  };
  function drawTotal(aths){
    const placesByDisc=ev.discs.map(d=>({d,map:placesInDiscipline(aths,d,ev.id)}));
    const rows=aths.map(a=>{let sum=0,counted=0;placesByDisc.forEach(({map})=>{const r=map.get(a.id);if(r){sum+=r.place;counted++;}});
      return {a,sum,counted};}).filter(r=>r.counted>0).sort((x,y)=>x.sum-y.sum||y.counted-x.counted);
    let place=0,prev=null,prevC=null;
    rows.forEach((r,i)=>{if(prev===null||r.sum!==prev||r.counted!==prevC){place=i+1;prev=r.sum;prevC=r.counted;}r.place=place;});
    const none=aths.filter(a=>!rows.find(r=>r.a.id===a.id));
    let b=`<div class="sec-title">Многоборье · сумма мест (меньше = лучше)</div>`;
    if(!rows.length)b+=`<div class="empty">Нет результатов</div>`;
    b+=rows.map(r=>rankRow(r.place,r.a.fio,`<span style="font-size:14px">∑ ${r.sum}</span> <span style="font-size:11px;color:var(--mut)">(${r.counted} дисц.)</span>`)).join('');
    if(none.length)b+=`<div class="sec-title">Без результатов</div>`+none.map(a=>`<div class="rank"><div class="pos">–</div><div class="nm none">${a.fio}</div></div>`).join('');
    return b;
  }
  function rankRow(place,fio,res){const medal=place===1?'🥇':place===2?'🥈':place===3?'🥉':place;
    return `<div class="rank p${place<=3?place:0}"><div class="pos">${medal}</div><div class="nm">${fio}</div><div class="res">${res}</div></div>`;}
  document.getElementById('seg').querySelectorAll('button').forEach(btn=>btn.onclick=()=>{cur=btn.dataset.d;
    document.querySelectorAll('#seg button').forEach(x=>x.classList.remove('on'));btn.classList.add('on');draw();});
  document.getElementById('segSex').querySelectorAll('button').forEach(btn=>btn.onclick=()=>{RANK_SEX=btn.dataset.s;
    document.querySelectorAll('#segSex button').forEach(x=>x.classList.remove('on'));btn.classList.add('on');draw();});
  draw();dock.innerHTML=`<button class="btn ghost" onclick="goBack('athletes')">‹ К участникам</button>`;
}

function goBack(v){if(v==='events'){S.ev=null;S.group=null;S.athlete=null;}
  if(v==='groups'){S.group=null;S.athlete=null;}if(v==='athletes'){S.athlete=null;}S.view=v;render();}
window.goBack=goBack;

/* ── Синхронизация ── */
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbwTOsVLE6wj0teXdu46Tq9P3tjj0cdnQQtPS3JQFP7EQT1shiHSxpQpe4oOV-xqMbtERQ/exec'; // ← вставь сюда URL веб-приложения Apps Script
async function syncUp(){
  if(!navigator.onLine){toast('Нет интернета — синхр. позже');return;}
  if(!APPS_SCRIPT_URL){toast('Не задан URL Apps Script (см. инструкцию)');return;}
  toast('Соединение…');
  try{const r=await fetch(APPS_SCRIPT_URL);const data=await r.json();
    if(data.athletes){ATHLETES=data.athletes.map(a=>({id:String(a.ID),fio:a.ФИО,dob:toISO(a.ДатаРождения),
      sex:String(a.Пол||'').toLowerCase().startsWith('м')?'м':'ж'})).filter(a=>a.fio);await kvSet('athletes',ATHLETES);}
  }catch(e){toast('Не удалось скачать список');return;}
  const pending=Object.keys(DIRTY);
  if(pending.length){const rows=pending.map(k=>{const[ev,a,d]=k.split('|');return{ev,athlete:a,disc:d,value:RESULTS[k]};});
    try{await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'saveResults',rows})});DIRTY={};await saveResults();}
    catch(e){toast('Список обновлён, результаты не ушли');return;}}
  toast(`Готово ✓ Спортсменов: ${ATHLETES.length}`);render();
}

/* ── Утилиты ── */
function fmtDate(s){if(!s)return'';const d=new Date(s);return isNaN(d)?'':d.toLocaleDateString('ru-RU',{day:'2-digit',month:'long',year:'numeric'});}
function todayISO(){return new Date().toISOString().slice(0,10);}
function toISO(v){if(!v)return'';if(typeof v==='string'&&/^\d{4}-\d{2}-\d{2}/.test(v))return v.slice(0,10);
  const d=new Date(v);return isNaN(d)?'':d.toISOString().slice(0,10);}
function showModal(){modal.classList.add('show');}
function hideModal(){modal.classList.remove('show');}
modal.onclick=e=>{if(e.target===modal)hideModal();};
function updateNet(){const el=document.getElementById('net');const on=navigator.onLine;
  el.classList.toggle('on',on);document.getElementById('netTxt').textContent=on?'онлайн':'офлайн';}
window.addEventListener('online',updateNet);window.addEventListener('offline',updateNet);

(async()=>{await loadAll();updateNet();render();})();
</script>

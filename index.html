<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Точка Отрыва · Результаты</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --line:#2a3242;
    --ink:#e6edf3; --mut:#8b97a7; --accent:#ff6b35; --accent2:#ffb020;
    --good:#3fb950; --bad:#f85149; --gold:#ffd23f; --silver:#c8d0da; --bronze:#e08b4c;
    --r:16px; --r2:12px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;
    overscroll-behavior:none;}
  body{max-width:560px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column;}

  /* ── Шапка ── */
  header{padding:14px 16px calc(12px); background:linear-gradient(135deg,#161b22,#1c2230);
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30;}
  .brand{display:flex; align-items:center; gap:10px;}
  .logo{width:36px; height:36px; border-radius:10px; flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid; place-items:center; font-weight:800; color:#1a1206; font-size:18px;}
  .brand h1{font-size:16px; margin:0; letter-spacing:.2px;}
  .brand .sub{font-size:11px; color:var(--mut); margin-top:1px;}
  .net{margin-left:auto; font-size:11px; padding:4px 9px; border-radius:20px;
    border:1px solid var(--line); display:flex; align-items:center; gap:5px;}
  .net .dot{width:7px; height:7px; border-radius:50%; background:var(--bad);}
  .net.on .dot{background:var(--good);}

  /* ── Хлебные крошки / контекст ── */
  .crumbs{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; font-size:12px;}
  .crumb{background:var(--panel2); border:1px solid var(--line); padding:4px 10px;
    border-radius:20px; color:var(--mut);}
  .crumb b{color:var(--ink); font-weight:600;}

  main{flex:1; padding:14px 14px calc(96px + var(--safe-b)); }

  /* ── Карточки выбора ── */
  .sec-title{font-size:12px; text-transform:uppercase; letter-spacing:1.2px;
    color:var(--mut); margin:18px 4px 8px;}
  .sec-title:first-child{margin-top:4px;}

  .list{display:flex; flex-direction:column; gap:8px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
    padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer;
    transition:transform .08s ease, border-color .15s;}
  .card:active{transform:scale(.985); border-color:var(--accent);}
  .card .ic{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;
    background:var(--panel2); font-size:20px;}
  .card .body{flex:1; min-width:0;}
  .card .t{font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card .d{font-size:12px; color:var(--mut); margin-top:2px;}
  .card .chev{color:var(--mut); font-size:18px;}
  .pill{font-size:10px; padding:2px 8px; border-radius:20px; font-weight:700;
    text-transform:uppercase; letter-spacing:.5px;}
  .pill.act{background:rgba(63,185,80,.15); color:var(--good);}
  .pill.ina{background:rgba(139,151,167,.15); color:var(--mut);}
  .pill.done{background:rgba(255,210,63,.15); color:var(--gold);}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .agecard{background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
    padding:16px 12px; text-align:center; cursor:pointer; transition:transform .08s, border-color .15s;}
  .agecard:active{transform:scale(.97); border-color:var(--accent);}
  .agecard .n{font-size:22px; font-weight:800;}
  .agecard .l{font-size:11px; color:var(--mut); margin-top:3px;}
  .agecard .c{font-size:11px; color:var(--accent2); margin-top:6px;}

  /* ── Экран участника ── */
  .athlete-head{background:linear-gradient(135deg,var(--panel),var(--panel2));
    border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-bottom:14px;}
  .athlete-head .nm{font-size:19px; font-weight:700;}
  .athlete-head .mt{font-size:12px; color:var(--mut); margin-top:4px;}

  .disc{background:var(--panel); border:1px solid var(--line); border-radius:var(--r2);
    padding:12px 14px; margin-bottom:8px;}
  .disc .top{display:flex; align-items:center; gap:8px;}
  .disc .nm{font-weight:600; font-size:14px; flex:1;}
  .disc .dir{font-size:10px; color:var(--mut); border:1px solid var(--line);
    padding:2px 7px; border-radius:12px;}
  .disc .row{display:flex; gap:8px; margin-top:10px; align-items:center;}
  .disc input{flex:1; background:var(--bg); border:1px solid var(--line); color:var(--ink);
    font-size:18px; font-weight:700; padding:11px 12px; border-radius:10px; width:100%;
    text-align:center; -moz-appearance:textfield;}
  .disc input::-webkit-outer-spin-button,.disc input::-webkit-inner-spin-button{-webkit-appearance:none;}
  .disc input:focus{outline:none; border-color:var(--accent);}
  .disc .unit{font-size:13px; color:var(--mut); min-width:54px;}
  .disc.saved{border-color:rgba(63,185,80,.4);}
  .disc.saved input{color:var(--good);}

  /* ── Таблица мест ── */
  .rank{display:flex; align-items:center; gap:12px; background:var(--panel);
    border:1px solid var(--line); border-radius:var(--r2); padding:11px 14px; margin-bottom:7px;}
  .rank .pos{width:34px; height:34px; border-radius:9px; flex:none; display:grid; place-items:center;
    font-weight:800; font-size:15px; background:var(--panel2);}
  .rank.p1 .pos{background:linear-gradient(135deg,#ffd23f,#e0a020); color:#3a2a00;}
  .rank.p2 .pos{background:linear-gradient(135deg,#d8e0ea,#a8b2c0); color:#2a2f38;}
  .rank.p3 .pos{background:linear-gradient(135deg,#e8a060,#c47028); color:#3a1f00;}
  .rank .nm{flex:1; font-weight:600; font-size:14px;}
  .rank .res{font-weight:800; font-size:16px; color:var(--accent2);}
  .rank .none{color:var(--mut); font-weight:400; font-size:13px;}

  /* ── Кнопки ── */
  .btn{width:100%; border:none; border-radius:13px; padding:15px; font-size:15px; font-weight:700;
    cursor:pointer; color:#1a1206; background:linear-gradient(135deg,var(--accent),var(--accent2));
    transition:transform .08s;}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:var(--panel); color:var(--ink); border:1px solid var(--line);}
  .btn.wide{margin-top:10px;}
  .seg{display:flex; gap:6px; margin-bottom:12px;}
  .seg button{flex:1; background:var(--panel); border:1px solid var(--line); color:var(--mut);
    padding:9px; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer;}
  .seg button.on{background:var(--accent); color:#1a1206; border-color:var(--accent);}

  /* ── Нижняя панель действий ── */
  .dock{position:fixed; left:0; right:0; bottom:0; z-index:40; max-width:560px; margin:0 auto;
    background:linear-gradient(180deg,rgba(13,17,23,.4),var(--bg) 40%);
    padding:10px 14px calc(12px + var(--safe-b)); display:flex; gap:8px;}
  .dock .btn{flex:1;}

  .back{background:none; border:none; color:var(--accent2); font-size:14px; font-weight:600;
    cursor:pointer; padding:4px 0; display:flex; align-items:center; gap:5px; margin-bottom:6px;}

  .empty{text-align:center; color:var(--mut); padding:40px 20px; font-size:14px;}
  .toast{position:fixed; left:50%; bottom:calc(90px + var(--safe-b)); transform:translateX(-50%);
    background:#000; color:#fff; padding:10px 18px; border-radius:24px; font-size:13px; z-index:60;
    opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap;}
  .toast.show{opacity:.95;}
  .badge-count{background:var(--accent); color:#1a1206; font-size:11px; font-weight:800;
    border-radius:12px; padding:1px 7px; margin-left:6px;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">ТО</div>
    <div>
      <h1>Результаты</h1>
      <div class="sub">Точка Отрыва · соревнования</div>
    </div>
    <div class="net" id="net"><span class="dot"></span><span id="netTxt">офлайн</span></div>
  </div>
  <div class="crumbs" id="crumbs"></div>
</header>

<main id="app"></main>

<div class="dock" id="dock"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ДАННЫЕ-ОБРАЗЦЫ (демо). В бою сюда подтянутся данные из Google Sheets.
   ============================================================ */
const DEMO = {
  events: [
    {id:'EV1', name:'Зимний кубок ОФП 2026', date:'2026-02-15', status:'active'},
    {id:'EV2', name:'Открытое первенство Double Dutch', date:'2026-03-22', status:'active'},
    {id:'EV3', name:'Осенний турнир (архив)', date:'2025-11-10', status:'inactive'},
  ],
  // направление: 'max' = больше лучше, 'min' = меньше лучше
  disciplines: [
    {id:'d1', name:'Подтягивания 30 сек', unit:'раз', dir:'max'},
    {id:'d2', name:'Прыжок в длину', unit:'см', dir:'max'},
    {id:'d3', name:'Челночный бег 3×10', unit:'сек', dir:'min'},
    {id:'d4', name:'Пресс 30 сек', unit:'раз', dir:'max'},
    {id:'d5', name:'Шпагат (до пола)', unit:'см', dir:'min'},
    {id:'d6', name:'Speed 30 сек', unit:'прыжки', dir:'max'},
  ],
  athletes: [
    {id:'a1', ev:'EV1', fio:'Иванова Мария', dob:'2019-04-12', sex:'ж'},
    {id:'a2', ev:'EV1', fio:'Петров Артём', dob:'2018-08-30', sex:'м'},
    {id:'a3', ev:'EV1', fio:'Сидорова Аня', dob:'2017-01-15', sex:'ж'},
    {id:'a4', ev:'EV1', fio:'Кузнецов Дима', dob:'2016-06-05', sex:'м'},
    {id:'a5', ev:'EV1', fio:'Орлова Вика', dob:'2014-03-20', sex:'ж'},
    {id:'a6', ev:'EV1', fio:'Морозов Лев', dob:'2015-09-09', sex:'м'},
    {id:'a7', ev:'EV1', fio:'Зайцева Соня', dob:'2018-11-02', sex:'ж'},
    {id:'a8', ev:'EV1', fio:'Соколов Иван', dob:'2017-07-07', sex:'м'},
    {id:'a9', ev:'EV2', fio:'Волкова Ника', dob:'2016-02-18', sex:'ж'},
  ],
};

/* Возрастные группы по году. Считаем из даты рождения. */
const AGE_GROUPS = [
  {min:3,max:4,label:'3–4 года'},
  {min:5,max:6,label:'5–6 лет'},
  {min:7,max:8,label:'7–8 лет'},
  {min:9,max:10,label:'9–10 лет'},
  {min:11,max:12,label:'11–12 лет'},
];
function ageOf(dob){
  const b=new Date(dob), n=new Date();
  let a=n.getFullYear()-b.getFullYear();
  const m=n.getMonth()-b.getMonth();
  if(m<0||(m===0&&n.getDate()<b.getDate())) a--;
  return a;
}
function groupOf(dob){
  const a=ageOf(dob);
  const g=AGE_GROUPS.find(g=>a>=g.min&&a<=g.max);
  return g?g.label:`${a} лет (вне групп)`;
}

/* ============================================================
   ХРАНИЛИЩЕ (IndexedDB) — работает офлайн
   ============================================================ */
const DB_NAME='tochka_results', STORE='kv';
let _db=null;
function db(){
  return new Promise((res,rej)=>{
    if(_db) return res(_db);
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(STORE);
    r.onsuccess=()=>{_db=r.result;res(_db);};
    r.onerror=()=>rej(r.error);
  });
}
async function kvGet(k){const d=await db();return new Promise(r=>{const t=d.transaction(STORE).objectStore(STORE).get(k);t.onsuccess=()=>r(t.result);t.onerror=()=>r(undefined);});}
async function kvSet(k,v){const d=await db();return new Promise(r=>{const t=d.transaction(STORE,'readwrite').objectStore(STORE).put(v,k);t.onsuccess=()=>r(true);t.onerror=()=>r(false);});}

/* состояние результатов: { "ev|athleteId|discId": value } */
let RESULTS={};
let DIRTY={}; // что не синхронизировано
async function loadResults(){RESULTS=(await kvGet('results'))||{};DIRTY=(await kvGet('dirty'))||{};}
async function saveResults(){await kvSet('results',RESULTS);await kvSet('dirty',DIRTY);}
function rk(ev,a,d){return `${ev}|${a}|${d}`;}

/* ============================================================
   НАВИГАЦИЯ
   ============================================================ */
const S={ev:null, group:null, athlete:null, view:'events'};
const app=document.getElementById('app');
const dock=document.getElementById('dock');
const crumbsEl=document.getElementById('crumbs');

function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800);}

function crumbs(){
  const parts=[];
  if(S.ev) parts.push(`<span class="crumb">📋 <b>${DEMO.events.find(e=>e.id===S.ev).name}</b></span>`);
  if(S.group) parts.push(`<span class="crumb">👥 <b>${S.group}</b></span>`);
  if(S.athlete) parts.push(`<span class="crumb">🏃 <b>${DEMO.athletes.find(a=>a.id===S.athlete).fio}</b></span>`);
  crumbsEl.innerHTML=parts.join('');
}

function render(){
  crumbs();
  dock.innerHTML='';
  if(S.view==='events') return viewEvents();
  if(S.view==='groups') return viewGroups();
  if(S.view==='athletes') return viewAthletes();
  if(S.view==='athlete') return viewAthlete();
  if(S.view==='ranking') return viewRanking();
}

/* ── Экран: события ── */
function viewEvents(){
  const active=DEMO.events.filter(e=>e.status==='active');
  const arch=DEMO.events.filter(e=>e.status!=='active');
  let h=`<div class="sec-title">Активные мероприятия</div><div class="list">`;
  h+=active.map(eventCard).join('')||`<div class="empty">Нет активных мероприятий</div>`;
  h+=`</div>`;
  if(arch.length){h+=`<div class="sec-title">Архив</div><div class="list">${arch.map(eventCard).join('')}</div>`;}
  app.innerHTML=h;
  app.querySelectorAll('[data-ev]').forEach(el=>el.onclick=()=>{S.ev=el.dataset.ev;S.view='groups';render();});
  dock.innerHTML=`<button class="btn" id="sync">⟳ Синхронизировать с Google Sheets</button>`;
  document.getElementById('sync').onclick=syncUp;
}
function eventCard(e){
  const pill=e.status==='active'?'<span class="pill act">активно</span>':'<span class="pill ina">архив</span>';
  return `<div class="card" data-ev="${e.id}">
    <div class="ic">🏆</div>
    <div class="body"><div class="t">${e.name}</div><div class="d">${fmtDate(e.date)}</div></div>
    ${pill}<span class="chev">›</span></div>`;
}

/* ── Экран: возрастные группы ── */
function viewGroups(){
  const aths=DEMO.athletes.filter(a=>a.ev===S.ev);
  const counts={};
  aths.forEach(a=>{const g=groupOf(a.dob);counts[g]=(counts[g]||0)+1;});
  app.innerHTML=`<button class="back" onclick="goBack('events')">‹ Мероприятия</button>
    <div class="sec-title">Выберите возрастную группу</div>
    <div class="grid2">${AGE_GROUPS.map(g=>{
      const c=counts[g.label]||0;
      return `<div class="agecard" data-g="${g.label}">
        <div class="n">${g.label.split(' ')[0]}</div>
        <div class="l">${g.label.replace(/^\S+\s/,'')}</div>
        <div class="c">${c} участ.</div></div>`;
    }).join('')}</div>`;
  app.querySelectorAll('[data-g]').forEach(el=>el.onclick=()=>{S.group=el.dataset.g;S.view='athletes';render();});
}

/* ── Экран: участники в группе ── */
function viewAthletes(){
  const aths=DEMO.athletes.filter(a=>a.ev===S.ev&&groupOf(a.dob)===S.group);
  let h=`<button class="back" onclick="goBack('groups')">‹ Группы</button>
    <div class="sec-title">Участники · нажмите для ввода</div><div class="list">`;
  h+=aths.map(a=>{
    const filled=DEMO.disciplines.filter(d=>RESULTS[rk(S.ev,a.id,d.id)]!=null).length;
    const done=filled>0?`<span class="pill done">${filled}/${DEMO.disciplines.length}</span>`:'';
    return `<div class="card" data-a="${a.id}">
      <div class="ic">🏃</div>
      <div class="body"><div class="t">${a.fio}</div>
        <div class="d">${fmtDate(a.dob)} · ${ageOf(a.dob)} лет</div></div>
      ${done}<span class="chev">›</span></div>`;
  }).join('')||`<div class="empty">В этой группе нет участников</div>`;
  h+=`</div>`;
  app.innerHTML=h;
  app.querySelectorAll('[data-a]').forEach(el=>el.onclick=()=>{S.athlete=el.dataset.a;S.view='athlete';render();});
  dock.innerHTML=`<button class="btn" id="rk">🥇 Показать места</button>`;
  document.getElementById('rk').onclick=()=>{S.view='ranking';render();};
}

/* ── Экран: ввод результатов участника ── */
function viewAthlete(){
  const a=DEMO.athletes.find(x=>x.id===S.athlete);
  let h=`<button class="back" onclick="goBack('athletes')">‹ Участники</button>
    <div class="athlete-head"><div class="nm">${a.fio}</div>
      <div class="mt">${a.sex==='м'?'👦':'👧'} ${fmtDate(a.dob)} · ${ageOf(a.dob)} лет · ${groupOf(a.dob)}</div></div>`;
  h+=DEMO.disciplines.map(d=>{
    const v=RESULTS[rk(S.ev,a.id,d.id)];
    const dir=d.dir==='max'?'↑ больше лучше':'↓ меньше лучше';
    return `<div class="disc ${v!=null?'saved':''}" data-d="${d.id}">
      <div class="top"><div class="nm">${d.name}</div><div class="dir">${dir}</div></div>
      <div class="row">
        <input type="number" inputmode="decimal" step="any" placeholder="—"
               value="${v!=null?v:''}" data-input="${d.id}">
        <span class="unit">${d.unit}</span>
      </div></div>`;
  }).join('');
  app.innerHTML=h;
  app.querySelectorAll('[data-input]').forEach(inp=>{
    inp.onchange=()=>{
      const did=inp.dataset.input;const key=rk(S.ev,a.id,did);
      const raw=inp.value.trim();
      if(raw===''){delete RESULTS[key];delete DIRTY[key];}
      else{RESULTS[key]=parseFloat(raw.replace(',','.'));DIRTY[key]=1;}
      saveResults();
      inp.closest('.disc').classList.toggle('saved',raw!=='');
      toast('Сохранено локально');
    };
  });
  dock.innerHTML=`<button class="btn ghost" onclick="goBack('athletes')">Готово</button>
    <button class="btn" id="rk">🥇 Места</button>`;
  document.getElementById('rk').onclick=()=>{S.view='ranking';render();};
}

/* Места в одной дисциплине для набора участников (с учётом направления).
   Возвращает Map: athleteId -> {place, value}. Делит места при равенстве. */
function placesInDiscipline(aths, d){
  const scored=aths.map(a=>({a,v:RESULTS[rk(S.ev,a.id,d.id)]})).filter(x=>x.v!=null);
  scored.sort((x,y)=>d.dir==='max'?y.v-x.v:x.v-y.v);
  const map=new Map(); let place=0, prev=null;
  scored.forEach((x,i)=>{
    if(prev===null||x.v!==prev){place=i+1;prev=x.v;} // равный результат = равное место
    map.set(x.a.id,{place,value:x.v});
  });
  return map;
}

/* ── Экран: рейтинг (места) ── */
let RANK_SEX='м'; // запоминаем выбранный пол между перерисовками
function viewRanking(){
  // вкладки: каждая дисциплина + «Общий зачёт»
  const tabs=[...DEMO.disciplines.map(d=>({id:d.id,label:d.name.split(' ')[0]})),
              {id:'__total__',label:'Общий зачёт'}];
  let cur=tabs[0].id;

  const segDisc=`<div class="seg" id="seg">${tabs.map((t,i)=>
    `<button data-d="${t.id}" class="${i===0?'on':''}">${t.label}</button>`).join('')}</div>`;
  const segSex=`<div class="seg" id="segSex" style="margin-bottom:14px;">
    <button data-s="м" class="${RANK_SEX==='м'?'on':''}">👦 Мальчики</button>
    <button data-s="ж" class="${RANK_SEX==='ж'?'on':''}">👧 Девочки</button></div>`;

  app.innerHTML=`<button class="back" onclick="goBack('athletes')">‹ Участники</button>
    ${segSex}<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">${segDisc}</div>
    <div id="rankBody"></div>`;

  const draw=()=>{
    const aths=DEMO.athletes.filter(a=>a.ev===S.ev&&groupOf(a.dob)===S.group&&a.sex===RANK_SEX);
    let b='';
    if(cur==='__total__'){
      b=drawTotal(aths);
    }else{
      const d=DEMO.disciplines.find(x=>x.id===cur);
      const pl=placesInDiscipline(aths,d);
      const ranked=[...pl.entries()].map(([id,o])=>({a:aths.find(x=>x.id===id),...o}))
                    .sort((x,y)=>x.place-y.place);
      const none=aths.filter(a=>!pl.has(a.id));
      b=`<div class="sec-title">${d.name} · ${d.dir==='max'?'больше лучше ↑':'меньше лучше ↓'}</div>`;
      if(!ranked.length) b+=`<div class="empty">Пока нет результатов в этой дисциплине</div>`;
      b+=ranked.map(x=>rankRow(x.place,x.a.fio,`${x.value} <span style="font-size:12px;color:var(--mut)">${d.unit}</span>`)).join('');
      if(none.length) b+=`<div class="sec-title">Без результата</div>`+
        none.map(a=>`<div class="rank"><div class="pos">–</div><div class="nm none">${a.fio}</div></div>`).join('');
    }
    document.getElementById('rankBody').innerHTML=b;
  };

  // Общий зачёт: сумма мест по всем дисциплинам, где есть результат. Меньше сумма = выше место.
  function drawTotal(aths){
    const placesByDisc=DEMO.disciplines.map(d=>({d,map:placesInDiscipline(aths,d)}));
    const rows=aths.map(a=>{
      let sum=0,counted=0;
      placesByDisc.forEach(({map})=>{const r=map.get(a.id);if(r){sum+=r.place;counted++;}});
      return {a,sum,counted};
    }).filter(r=>r.counted>0).sort((x,y)=>x.sum-y.sum||y.counted-x.counted);

    // присвоить итоговые места (равная сумма = равное место)
    let place=0,prev=null,prevC=null;
    rows.forEach((r,i)=>{if(prev===null||r.sum!==prev||r.counted!==prevC){place=i+1;prev=r.sum;prevC=r.counted;}r.place=place;});

    const none=aths.filter(a=>!rows.find(r=>r.a.id===a.id));
    let b=`<div class="sec-title">Многоборье · сумма мест (меньше = лучше)</div>`;
    if(!rows.length) b+=`<div class="empty">Нет результатов ни в одной дисциплине</div>`;
    b+=rows.map(r=>rankRow(r.place,r.a.fio,
        `<span style="font-size:14px">∑ ${r.sum}</span> <span style="font-size:11px;color:var(--mut)">(${r.counted} дисц.)</span>`)).join('');
    if(none.length) b+=`<div class="sec-title">Без результатов</div>`+
      none.map(a=>`<div class="rank"><div class="pos">–</div><div class="nm none">${a.fio}</div></div>`).join('');
    return b;
  }

  function rankRow(place,fio,res){
    const medal=place===1?'🥇':place===2?'🥈':place===3?'🥉':place;
    return `<div class="rank p${place<=3?place:0}">
      <div class="pos">${medal}</div><div class="nm">${fio}</div>
      <div class="res">${res}</div></div>`;
  }

  document.getElementById('seg').querySelectorAll('button').forEach(btn=>{
    btn.onclick=()=>{cur=btn.dataset.d;document.querySelectorAll('#seg button').forEach(x=>x.classList.remove('on'));btn.classList.add('on');draw();};
  });
  document.getElementById('segSex').querySelectorAll('button').forEach(btn=>{
    btn.onclick=()=>{RANK_SEX=btn.dataset.s;document.querySelectorAll('#segSex button').forEach(x=>x.classList.remove('on'));btn.classList.add('on');draw();};
  });
  draw();
  dock.innerHTML=`<button class="btn ghost" onclick="goBack('athletes')">‹ К участникам</button>`;
}

function goBack(v){
  if(v==='events'){S.ev=null;S.group=null;S.athlete=null;}
  if(v==='groups'){S.group=null;S.athlete=null;}
  if(v==='athletes'){S.athlete=null;}
  S.view=v;render();
}
window.goBack=goBack;

/* ── Синхронизация с Apps Script ── */
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbyQp4IZDoJ6BmL1ZjYW1TufWv8O8gVXc8nDNx4Ut51gFvyVPSDJaz7eR1h1nxvCxtQALQ/exec'; // ← сюда вставите URL вашего веб-приложения
async function syncUp(){
  const pending=Object.keys(DIRTY);
  if(!pending.length){toast('Всё уже синхронизировано ✓');return;}
  if(!navigator.onLine){toast('Нет интернета — синхронизируем позже');return;}
  if(!APPS_SCRIPT_URL){toast('Не задан URL Apps Script (см. инструкцию)');return;}
  toast(`Отправка ${pending.length} результатов…`);
  const payload=pending.map(k=>{const[ev,a,d]=k.split('|');return{ev,athlete:a,disc:d,value:RESULTS[k]};});
  try{
    await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'saveResults',rows:payload})});
    DIRTY={};await saveResults();toast('Синхронизировано ✓');
  }catch(e){toast('Ошибка сети — данные сохранены локально');}
}

/* ── Утилиты ── */
function fmtDate(s){const d=new Date(s);return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'long',year:'numeric'});}
function updateNet(){const el=document.getElementById('net');const on=navigator.onLine;
  el.classList.toggle('on',on);document.getElementById('netTxt').textContent=on?'онлайн':'офлайн';}
window.addEventListener('online',updateNet);window.addEventListener('offline',updateNet);

/* ── Старт ── */
(async()=>{await loadResults();updateNet();render();})();
</script>
